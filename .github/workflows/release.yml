name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      # Third-party actions are pinned to a commit: this job can write
      # releases, and a tag can be moved to different code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Extract version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve SPM dependencies
        working-directory: Murmur
        run: swift package resolve

      # Same light-tier suite as ci.yml; a tag can point at a commit CI never saw.
      - name: Run tests
        working-directory: Murmur
        run: swift test

      # The script builds, assembles, signs and packages; it is the same one
      # used for local release builds.
      - name: Build app bundle and DMG
        working-directory: Murmur
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./Scripts/build-release.sh "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: Murmur/dist/Murmur-${{ steps.version.outputs.VERSION }}.dmg
          generate_release_notes: true
