name: CI

# Gates every pull request and every push to main with a build + the
# light-tier test suite.
#
# LIGHT TIER ONLY. Nothing here downloads the speech model, so tests that
# need real model weights skip themselves (they check for the model on disk,
# or go through TestHeavyGate); AX tests skip without an Accessibility grant.
# Both are expected skips on CI, not failures.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Resolve SPM dependencies
        working-directory: Murmur
        run: swift package resolve

      - name: Build (debug)
        working-directory: Murmur
        run: swift build

      - name: Run light-tier tests
        working-directory: Murmur
        run: swift test
